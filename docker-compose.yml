# Real PostgreSQL for MerchOps (optional — default local DB is SQLite)
# Usage:
#   docker compose up -d
#   cp .env.postgres.example .env   # or merge DATABASE_URL
#   npm run db:push && npm run db:seed
#   npm run dev

services:
  db:
    image: postgres:16-alpine
    container_name: merchops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: merchops
      POSTGRES_PASSWORD: merchops
      POSTGRES_DB: merchops
    ports:
      - "5432:5432"
    volumes:
      - merchops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchops -d merchops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  merchops_pg:
